<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>המשרות שלי</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f5f7;--card:#fff;--txt:#1d1d1f;--mut:#6e6e73;--line:#d2d2d7;--blue:#0071e3;--green:#1d8a3a;--amber:#b25f00;--red:#c4302b}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Heebo,-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--txt);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
.wrap{width:min(900px,92%);margin:0 auto}
/* lock screen */
#lock{min-height:100vh;display:flex;align-items:center;justify-content:center}
#lock form{background:var(--card);padding:40px;border-radius:24px;width:min(380px,92%);text-align:center;box-shadow:0 4px 30px #0000000d}
#lock h1{font-size:1.6rem;margin-bottom:6px}#lock p{color:var(--mut);margin-bottom:22px}
input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;font:1rem Heebo;margin-bottom:12px;direction:ltr;text-align:center}
input:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px #0071e333}
.btn{display:inline-block;background:var(--blue);color:#fff;border:0;border-radius:980px;padding:11px 22px;font:500 1rem Heebo;cursor:pointer;text-decoration:none!important}
.btn:hover{background:#0077ed}
.btn-sec{background:transparent;color:var(--blue);border:1px solid var(--blue)}
.btn-sec:hover{background:var(--blue);color:#fff}
#err{color:var(--red);margin-top:10px;min-height:1.4em}
/* app */
#app{display:none;padding:40px 0 80px}
header h1{font-size:2.2rem;font-weight:700;letter-spacing:-.01em}
header p{color:var(--mut)}
.tabs{display:flex;gap:22px;margin:28px 0 18px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;padding:10px 0;font:400 1.02rem Heebo;color:var(--blue);cursor:pointer}
.tab:hover{text-decoration:underline}
.tab.on{color:var(--txt);font-weight:700;cursor:default;text-decoration:none;box-shadow:inset 0 -2px 0 var(--txt)}
.card{background:var(--card);border-radius:20px;padding:26px 28px;margin-bottom:16px}
.top{display:flex;gap:18px;align-items:flex-start}
.score{flex:none;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:1.35rem;border:3px solid}
.s-hi{color:var(--green);border-color:var(--green)}.s-mid{color:var(--amber);border-color:var(--amber)}.s-lo{color:var(--mut);border-color:var(--line)}
.card h2{font-size:1.3rem;line-height:1.3}
.meta{color:var(--mut);font-size:.92rem;margin-top:4px}
.new{display:inline-block;font-size:.75rem;font-weight:700;color:var(--green);margin-inline-start:8px}
.rec{font-weight:700;margin-top:6px;font-size:.95rem}
.sec{margin-top:16px}
.sec h3{font-size:.95rem;color:var(--mut);font-weight:500;margin-bottom:4px}
.sec ul{padding-inline-start:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
details{margin-top:14px}
summary{color:var(--blue);cursor:pointer;font-size:.95rem}
summary:hover{text-decoration:underline}
.letter{white-space:pre-wrap;background:var(--bg);border-radius:12px;padding:16px;margin-top:10px;direction:ltr;text-align:left;font-size:.93rem}
.empty{color:var(--mut);text-align:center;padding:50px}
.hidebtn{background:none;border:0;color:var(--blue);font:inherit;cursor:pointer;font-size:.9rem;margin-inline-start:auto}
.hidebtn:hover{text-decoration:underline}
@media(max-width:640px){.grid{grid-template-columns:1fr}.card{padding:22px 18px}header h1{font-size:1.8rem}}
</style>
</head>
<body>
<div id="lock"><form id="f">
  <h1>המשרות שלי</h1><p>הכניסי סיסמה כדי לפתוח</p>
  <input id="pw" type="password" autocomplete="current-password" autofocus>
  <button class="btn" type="submit" style="width:100%">פתיחה</button>
  <div id="err"></div>
</form></div>

<div id="app" class="wrap">
  <header><h1>המשרות שלי</h1><p id="upd"></p></header>
  <div class="tabs" id="tabs"></div>
  <div id="list"></div>
</div>

<script>
const ENC = {"salt": "vdHokJASgqOt786Jh+nbXA==", "iv": "+CKcTLHI7IzkHQdf", "ct": "jC+qzPTTivfpVrdHlwQUUyvDL4aA5mplsh8IjLD/k81CCA5bLTaAfEI9x7RUI44emDZvbJq80X1Batk=", "iter": 250000};
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(ENC.salt), iterations:ENC.iter, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const out = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(ENC.iv)}, key, b64(ENC.ct));
  return JSON.parse(new TextDecoder().decode(out));
}
async function unlock(pw){
  try{ const d = await decrypt(pw); sessionStorage.setItem("pw", pw); render(d); }
  catch(e){ document.getElementById("err").textContent = "סיסמה שגויה"; }
}
document.getElementById("f").onsubmit = e => { e.preventDefault(); unlock(document.getElementById("pw").value); };
if (sessionStorage.getItem("pw")) unlock(sessionStorage.getItem("pw"));

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const REC = {Apply:["מומלץ להגיש","var(--green)"], Consider:["כדאי לשקול","var(--amber)"], Skip:["פחות מתאים","var(--mut)"]};
const hidden = new Set(JSON.parse(localStorage.getItem("hidden") || "[]"));
let DATA, TAB = "Apply";

function download(b, name, mime){
  const url = URL.createObjectURL(new Blob([b64(b)], {type:mime}));
  const a = Object.assign(document.createElement("a"), {href:url, download:name}); a.click();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function list(arr){ return arr && arr.length ? "<ul>" + arr.map(x => `<li>${esc(x)}</li>`).join("") + "</ul>" : "<p class='meta'>—</p>"; }

function render(d){
  DATA = d;
  document.getElementById("lock").style.display = "none";
  document.getElementById("app").style.display = "block";
  document.getElementById("upd").textContent = `עודכן לאחרונה: ${d.updated} · ${d.jobs.length} משרות`;
  draw();
}
function draw(){
  const today = new Date().toISOString().slice(0,10);
  const groups = {
    Apply: DATA.jobs.filter(j => j.a.recommendation === "Apply" && !hidden.has(j.id)),
    Consider: DATA.jobs.filter(j => j.a.recommendation === "Consider" && !hidden.has(j.id)),
    Skip: DATA.jobs.filter(j => j.a.recommendation === "Skip" && !hidden.has(j.id)),
    hidden: DATA.jobs.filter(j => hidden.has(j.id)),
  };
  const names = {Apply:"מומלצות", Consider:"לשקול", Skip:"פחות מתאימות", hidden:"הסתרתי"};
  document.getElementById("tabs").innerHTML = Object.keys(groups).map(k =>
    `<button class="tab ${k===TAB?"on":""}" data-k="${k}">${names[k]} (${groups[k].length})</button>`).join("");
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => { TAB = b.dataset.k; draw(); });

  const jobs = groups[TAB];
  document.getElementById("list").innerHTML = jobs.length ? jobs.map((j, i) => {
    const a = j.a, s = j.score >= 70 ? "s-hi" : j.score >= 50 ? "s-mid" : "s-lo";
    const [rt, rc] = REC[a.recommendation];
    const open = {open:"✓ פתוחה להגשה", closed:"סגורה"}[j.open_status] || "סטטוס לא אומת";
    return `<div class="card">
      <div class="top">
        <div class="score ${s}">${j.score}</div>
        <div style="flex:1">
          <h2>${esc(j.title)}${j.discovered === today ? '<span class="new">חדש היום</span>' : ""}</h2>
          <div class="meta">${esc(j.company)} · ${esc(j.location)} · ${esc(a.work_arrangement || j.employment || "")}</div>
          <div class="meta">פורסם: ${j.posted ? esc(j.posted) : "לא אומת"} · נמצא: ${esc(j.discovered)} · ${open} · מקור: ${esc(j.source)}</div>
          <div class="rec" style="color:${rc}">${rt}</div>
        </div>
        <button class="hidebtn" data-h="${esc(j.id)}">${hidden.has(j.id) ? "החזרה" : "הסתרה"}</button>
      </div>
      <div class="sec"><h3>למה זה מתאים לך</h3><p>${esc(a.why_fit_he)}</p></div>
      <div class="sec"><h3>מה חסר</h3><p>${esc(a.gaps_he)}</p></div>
      <div class="sec"><h3>איך יוצרים קשר</h3><p>${esc(a.contact_he)}</p></div>
      <details><summary>פירוט דרישות</summary>
        <div class="grid">
          <div class="sec"><h3>עומדת בדרישה</h3>${list(a.requirements_met)}</div>
          <div class="sec"><h3>חלקית, דרך ניסיון מקביל</h3>${list(a.requirements_partial)}</div>
          <div class="sec"><h3>לא עומדת</h3>${list(a.requirements_not_met)}</div>
          <div class="sec"><h3>לא ניתן לקבוע</h3>${list(a.requirements_unknown)}</div>
        </div>
      </details>
      ${j.cv ? `<details><summary>מה שיניתי בקורות החיים למשרה הזו</summary><p class="sec">${esc(j.cv.changes)}</p></details>
                <details><summary>מכתב מקדים</summary><div class="letter">${esc(j.cv.cover)}</div></details>` : ""}
      <div class="actions">
        <a class="btn" href="${esc(j.url)}" target="_blank" rel="noopener">לעמוד המשרה ולהגשה</a>
        ${j.cv && j.cv.docx ? `<button class="btn btn-sec" data-cv="${i}" data-t="docx">קורות חיים מותאמים (Word)</button>` : ""}
        ${j.cv && j.cv.pdf ? `<button class="btn btn-sec" data-cv="${i}" data-t="pdf">קורות חיים מותאמים (PDF)</button>` : ""}
      </div>
    </div>`;
  }).join("") : `<div class="empty">אין משרות בקטגוריה הזו</div>`;

  document.querySelectorAll("[data-cv]").forEach(b => b.onclick = () => {
    const j = jobs[+b.dataset.cv], t = b.dataset.t;
    download(j.cv[t], `${j.cv.name}.${t}`, t === "pdf" ? "application/pdf"
      : "application/vnd.openxmlformats-officedocument.wordprocessingml.document");
  });
  document.querySelectorAll("[data-h]").forEach(b => b.onclick = () => {
    const id = b.dataset.h; hidden.has(id) ? hidden.delete(id) : hidden.add(id);
    localStorage.setItem("hidden", JSON.stringify([...hidden])); draw();
  });
}
</script>
</body>
</html>
